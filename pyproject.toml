[project]
name = "devenv"
version = "0.1.0"
description = "Manage checkouts, worktrees and the user-level environment inside a dev VM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
devenv = "devenv.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devenv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
